name: CI Validation Suite

on:
  push:
    branches: [main, refactor/organize-project-architecture]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Static Security & Quality Linter
        run: npm run lint

      - name: Run Full Test Suite (Catalog, Ecosystem, WCAG, Security, E2E, TypeScript)
        run: npm test

      - name: Build Next.js Production App
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Real Browser E2E Tests (Chromium)
        run: npx playwright test --project=chromium
        env:
          CI: 'true'

      - name: Upload Playwright Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

