name: CI Validation Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run Catalog & Resource Audits
        run: node scripts/validate-catalog.js

      - name: Run Ecosystem Integration Tests
        run: node scripts/test-ecosystem.js
