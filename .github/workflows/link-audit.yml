name: Scheduled External Link Health Audit

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Enable manual trigger from GitHub UI

concurrency:
  group: link-audit
  cancel-in-progress: true

jobs:
  audit-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Catalog Link Health Audit
        run: node scripts/audit-links.js --all
        env:
          AUDIT_ALL: 'true'

      - name: Upload Link Audit Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-audit-report
          path: link-audit-report.json
          retention-days: 30
